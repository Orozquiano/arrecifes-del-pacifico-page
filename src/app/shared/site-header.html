<header class="site-header">
  <div class="header-bar wrap">
    <a class="brand" routerLink="/" aria-label="Arrecifes del Pacífico, ir al inicio">
      <img src="/images/logo-blanco.png" alt="" width="429" height="100" />
    </a>

    <nav #menuPanel id="menu-principal" class="menu-panel" aria-label="Principal">
      <a
        routerLink="/"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        >Inicio</a
      >
      <a routerLink="/cursos" routerLinkActive="is-active" ariaCurrentWhenActive="page">Cursos</a>
      <a routerLink="/viajes" routerLinkActive="is-active" ariaCurrentWhenActive="page">Viajes</a>
      <a routerLink="/nosotros" routerLinkActive="is-active" ariaCurrentWhenActive="page">Nosotros</a>
      <a routerLink="/tienda" routerLinkActive="is-active" ariaCurrentWhenActive="page">Tienda</a>
      <a routerLink="/contacto" routerLinkActive="is-active" ariaCurrentWhenActive="page">Contacto</a>
      <span #indicator class="menu-indicator" aria-hidden="true"></span>
    </nav>
  </div>
</header>

<a
  class="whatsapp-float"
  [href]="whatsappHref"
  target="_blank"
  rel="noopener noreferrer"
>
  <app-icon name="whatsapp" />
  <span>WhatsApp</span>
  <span class="visually-hidden"> (se abre en una pestaña nueva)</span>
</a>
